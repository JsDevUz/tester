# LiveKit server konfiguratsiyasi (jonli dars ovozi).
# Kalitlar docker-compose orqali LIVEKIT_KEYS env bilan beriladi.
# Redis — Egress (dars audiosini yozib olish) LiveKit bilan shu orqali
# gaplashadi, shuning uchun majburiy (Egress'siz ham LiveKit ishlayveradi,
# lekin Egress'ga so'rov yuborilsa Redis'siz doim timeout bo'ladi).
redis:
  address: localhost:6379
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  # VPS tashqi IP ni avtomatik aniqlaydi (STUN orqali)
  use_external_ip: true
logging:
  level: info
# Egress tugagach (yoki xato bo'lsa) LiveKit shu manzilga POST yuboradi —
# ClassroomRecordingController shu orqali recordingUrl/recordingStatus'ni
# to'ldiradi. api_key faqat imzo qaysi kalit bilan tekshirilishini
# ko'rsatadi (bu — .env'dagi LIVEKIT_API_KEY bilan bir xil, maxfiy emas;
# imzoning o'zi api_secret bilan hisoblanadi, u bu yerda yozilmaydi).
webhook:
  api_key: lk-mutolaa
  urls:
    - https://jamm.uz/api/v1/webhooks/livekit
