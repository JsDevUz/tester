name: gateway

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-jamm.uz}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:-livekit.jamm.uz}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy

volumes:
  caddy_data:
    external: true
    name: test-platform_caddy_data
  caddy_config:
    external: true
    name: test-platform_caddy_config
