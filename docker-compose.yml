services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testplatform}
      POSTGRES_USER: ${POSTGRES_USER:-testplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testplatform} -d ${POSTGRES_DB:-testplatform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-testplatform}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-testplatform}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      APP_URL: ${APP_URL:-http://localhost}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      OBJECT_STORAGE_BUCKET_NAME: ${OBJECT_STORAGE_BUCKET_NAME:-}
      OBJECT_STORAGE_PUBLIC_BASE_URL: ${OBJECT_STORAGE_PUBLIC_BASE_URL:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    volumes:
      - uploads_data:/app/apps/backend/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME:-}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-jamm.uz}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Caddy bridge tarmog'ida, livekit esa network_mode: host'da ishlaydi —
    # ular bir-biriga container nomi orqali ko'rinmaydi. extra_hosts orqali
    # Caddy konteyneri ichidan host makinaning o'zini nomlash uchun.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web

  # Jonli dars ovozi (SFU). Host tarmog'ida ishlaydi — UDP portlar (50000-50200)
  # to'g'ridan-to'g'ri ochiladi. LIVEKIT_API_KEY/SECRET .env da bo'lishi shart.
  livekit:
    image: livekit/livekit-server:v1.13.3
    restart: unless-stopped
    profiles: ["livekit"]
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis

  # LiveKit va Egress o'rtasidagi ish navbati — Egress'ga so'rov shu orqali
  # yetkaziladi, Redis'siz Egress so'rovlari doim timeout bo'ladi.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["livekit"]
    network_mode: host
    command: ["redis-server", "--port", "6379"]

  # Jonli dars audiosini yozib oladi (LiveKit Egress). Chrome-based worker —
  # LiveKit'ga Redis orqali ulanadi, yozib bo'lgach S3-mos xotiraga yuklaydi
  # (ClassroomRecordingService shu faylni keyin classroom-recordings/ ostida
  # kutadi). LIVEKIT_API_KEY/SECRET/URL — asosiy livekit xizmati bilan bir xil.
  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    profiles: ["livekit"]
    network_mode: host
    # Egress ichida Chrome (RoomComposite yozib olish uchun) ishlaydi —
    # LiveKit'ning o'zi talab qiladi: SYS_ADMIN'siz Chrome sandbox ishga
    # tushmaydi va Egress darhol chiqib ketadi.
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_WS_URL: ${LIVEKIT_URL:-}
    volumes:
      - ./docker/egress.yaml:/etc/egress.yaml:ro
    depends_on:
      - redis
      - livekit

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-testplatform}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-testplatform}
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate", "--workspace=apps/backend"]

  seed:
    build:
      context: .
      dockerfile: Dockerfile.backend
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-testplatform}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-testplatform}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE:-998901234567}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-changeme123}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "seed", "--workspace=apps/backend"]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  uploads_data:
